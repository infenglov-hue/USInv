benchmarks:
  equity_broad:
    symbol: "SPY"
    name: "SPDR S&P 500 ETF Trust"
    role: "US broad equity trend and baseline volatility"
  equity_tech:
    symbol: "QQQ"
    name: "Invesco QQQ Trust"
    role: "Growth and technology leadership benchmark"
  rates_bonds:
    symbol: "TLT"
    name: "iShares 20+ Year Treasury Bond ETF"
    role: "Long-term interest rate proxy (inverted to yields)"
  credit_spreads:
    symbol: "HYG"
    name: "iShares iBoxx $ High Yield Corporate Bond ETF"
    role: "Corporate credit risk appetite and default risk proxy"
  semiconductors:
    symbol: "SMH"
    name: "VanEck Semiconductor ETF"
    role: "High-beta cyclical risk leader"
  safe_haven:
    symbol: "GLD"
    name: "SPDR Gold Shares"
    role: "Inflation / currency debasement / flight-to-safety proxy"
  dollar_index:
    symbol: "UUP"
    name: "Invesco DB US Dollar Index Bullish Fund"
    role: "US Dollar strength / global liquidity proxy"
  market_volatility:
    symbol: "UVXY"
    name: "ProShares Ultra VIX Short-Term Futures ETF"
    role: "Equity volatility spike and tail-risk indicator"

regime_thresholds:
  risk_on:
    spy_above_20ema: true
    qqq_5d_return_min: 0.005 # +0.5% in 5 days
    uvxy_below_20ema: true
    hyg_vs_tlt_bullish: true
  risk_off:
    spy_below_50sma: true
    uvxy_surge_pct: 0.10 # +10% 5-day spike in UVXY
    uup_rally_pct: 0.01
