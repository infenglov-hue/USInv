# BIST Stock Picker — Threshold Values for Scoring and Filtering

buffett:
  # 2026-04-30 audit: tightened thresholds. Old values (5% ROE floor,
  # 2.0 D/E ceiling) let too many mediocre operators score above zero,
  # which the percentile-rank step then recycled into the top-N.
  min_roe_5yr: 0.15
  max_debt_equity: 1.0         # documentation-only; not used in scoring math
  min_gross_margin: 0.25       # BIST value kept; US sector mix is similar enough for a floor
  min_positive_eps_years: 6    # relaxed from 8 for emerging market
  roe_full_score: 0.25         # ROE >= 25% gets maximum score
  roe_min_score: 0.08          # ROE below 8% gets zero (was 0.05; below 8% in TRY is below cost of capital)
  debt_equity_ideal: 0.3       # D/E < 0.3 gets full score
  debt_equity_max: 1.5         # D/E > 1.5 gets zero (was 2.0; above 1.5 is genuinely risky in TRY)

graham:
  max_pe_pb_product: 22.5
  margin_of_safety: 0.25
  # 2026-04-30 audit: Graham now resolves bond yield dynamically from
  # MacroRegime.policy_rate_pct at scoring time. This value is only used
  # as a fallback when no macro row exists. Update if static fallback is
  # ever exercised (rare on the live pipeline).
  try_bond_yield: 0.045        # US port: fallback only — runtime value is FRED DGS10
  graham_numerator: 4.4        # US port: Graham's original 4.4 against the 10y Treasury yield

dcf:
  # Dynamic discount rate = TCMB policy rate + equity_risk_premium_try.
  # Falls back to discount_rate_try when:
  #   - dynamic_discount_rate is false
  #   - MacroRegime has no policy rate on or before scoring_date
  #   - dynamic rate would leave less than min_rate_terminal_spread above terminal growth
  dynamic_discount_rate: true
  # ERP fallback. At runtime the DCF scorer prefers macro.yaml erp.equity_risk_premium_try
  # (Damodaran, manually updated) over this value. Kept for legacy callers.
  equity_risk_premium_try: 0.045   # US port: USD ERP fallback (Damodaran US ~4.5%)
  min_rate_terminal_spread: 0.03  # US port: r ~9% vs g ~4.5% needs a thinner guard than TRY
  discount_rate_try: 0.09         # US port: static USD fallback (10y + ERP)
  # Static terminal growth fallback. At runtime DCF prefers
  # MacroRegime.inflation_expectation_24m_pct + macro.yaml real_growth_pct.
  # Lowered 0.12 -> 0.08 to reflect more realistic long-run TRY nominal
  # (~6% expected CPI + 2% real growth) when the dynamic path is unavailable.
  terminal_growth_try: 0.035      # US port: ~2.3% inflation + ~1.2% real
  projection_years: 10
  maintenance_capex_pct: 0.70     # approximate maintenance as 70% of total capex
  min_growth_rate: 0.02           # US port: floor ~ inflation pass-through
  max_growth_rate: 0.25           # US port: nominal USD growth ceiling
  conservative_growth_rate: 0.06  # used when only 1 year of EPS history exists

piotroski:
  min_fscore: 4                # minimum to be considered investable

momentum:
  # Academic 12-1 momentum skip: the most recent N calendar days are excluded
  # from every momentum window to avoid short-term reversal contamination.
  # Restored 2026-07-02 (was hard-coded to 0 as an ad-hoc falling-knife fix;
  # the selector's raw 200MA filter now owns falling-knife protection).
  # Set to 0 to reproduce the old no-skip behavior for A/B backtests.
  skip_days: 30

selection:
  # Rotation cadence (C1 calibration, 2026-07-04): rotate every N weeks on
  # the Monday cycle anchored at rotation_anchor_monday (a known rotation
  # Monday). Bi-weekly beat weekly on return/Sharpe/MaxDD/cost drag over
  # 2018-2026 (plan C1 Sonuçlar). check-exits still runs DAILY — a mid-cycle
  # stop closes the position and the slot stays in cash until the next
  # rotation Monday. Set rotation_weeks: 1 to restore weekly rotation.
  rotation_weeks: 2
  rotation_anchor_monday: "2026-06-29"
  # B1 daily trailing stop (2026-07-05 A/B, 2018-2026 biweekly, clean PIT):
  #   reset (pre-B1)      +2958%  MaxDD -22.1  Sharpe 2.264  hit 58.8
  #   carry-only          +2629%  MaxDD -20.6  Sharpe 2.255  hit 60.2
  #   TRAIL 20-35% (BU)   +2848%  MaxDD -20.6  Sharpe 2.283  hit 60.2
  #   trail 10-25%         +852%  MaxDD -25.5  <- ASLA: dar trail BIST'te katliam
  # 20-35% clamp: risk metriklerinin tamaminde en iyi, getiride reset'in %4
  # icinde; bedeli 2025 tarzi mega-ralli yillarinda erken cikis. min_pct'yi
  # 0.20'nin altina indirme — 10-25% varyanti getirinin ucte ikisini sildi.
  # Backtest CLI defaultlari da bu bloktan okunur (backtest = canli).
  trailing_stop:
    enabled: true
    min_pct: 0.20
    max_pct: 0.35
  # Phase 3 tightening (2026-04-18): lowered from 0.85 to 0.70 to force
  # the portfolio toward genuinely independent bets. Pairs above 0.70
  # realized return correlation are filtered from the candidate list.
  max_correlation: 0.70
  correlation_lookback_days: 120  # days of return history for correlation check
  max_target_multiple: 2.5     # cap: target <= entry * 2.5 (150% upside)
  target_count: 5
  # Phase 3 tightening: 3 -> 2. With 5 picks this guarantees coverage of at
  # least 3 distinct sub-sectors (previously one sector could dominate).
  max_per_sector: 2
  max_banks_per_portfolio: 2   # scaled with larger portfolio
  min_fscore: 4
  min_data_completeness: 60.0
  turnover_top_n: 10
  turnover_threshold: 0.05     # keep if within 5% of top scorer
  max_monthly_turnover: 0.50
  stop_loss_pct: 0.18
  min_technical_score: 35.0
  # ATR-based initial stop clamp (#10, exposed 2026-07-07). Stop distance =
  # 2×ATR(20)/entry, clamped to [min_stop_pct, max_stop_pct]. NOTE the
  # asymmetry with the TRAILING clamp (selection.trailing_stop 0.20-0.35):
  # the initial stop can be as tight as 10%, while the "tight stops are poison
  # on BIST" A/B finding applies to the trailing ratchet. Raising min_stop_pct
  # toward 0.15-0.20 aligns the two — A/B it before shipping live (do NOT flip
  # blindly; it changes live picks' stops).
  min_stop_pct: 0.10
  max_stop_pct: 0.25
  # #11 (2026-07-07): expected-move target for names WITHOUT a DCF MoS.
  # enabled=false keeps the current SCORE_IMPLIED (score×30%) fallback.
  # enabled=true → target = entry + atr_multiple × ATR(20) (volatility-scaled).
  target_expected_move:
    enabled: false
    atr_multiple: 3.0
  index_aware:
    # Portfolio V2 research switch. Used only when caller passes
    # strategy_variant="index_aware"; classic ALPHA stays unchanged by default.
    #
    # NOTE: the three weights below are normalized by their SUM at runtime
    # (selector._apply_index_aware_scores), so 0.75/0.35/0.05 act as
    # ~65% model / ~30% relative strength / ~4% technical — they are NOT
    # percentages. Also keep in mind the model composite already carries
    # momentum 0.25 + technical 0.05 internally, so the blended score is
    # roughly 45% trend/momentum-family by construction (intentional tilt).
    model_weight: 0.75
    relative_strength_weight: 0.35
    technical_weight: 0.05
    relative_lookback_days: 63
    min_bist100: 2
    # 2026-07-11 corrected annual/TTM PIT A/B (2018-03→2026-06, 216
    # biweekly dates, next-open, 20-35 trailing): cap=1 beat cap=2 on full
    # return (+1448.7% vs +1136.8%), CAGR, Sharpe, MaxDD, validate, TEST
    # 2024-26 alpha (+37.9pp vs +21.6pp), and every friction stress through
    # 1.5% round-trip. Keeps one small/mid-cap alpha sleeve without letting
    # two correlated non-index names dominate a five-stock portfolio.
    max_non_bist100: 1
    incumbent_window: 18
    # Checked against base_score (model composite 0-100), NOT the blended
    # score — on the blended scale 88 was effectively unreachable and the
    # turnover protection never fired (2026-07-02 fix).
    incumbent_min_score: 88.0
    financial_sleeve_min_score: 80.0
    financial_sleeve_min_relative_strength: 50.0
    min_avg_volume_try: 20_000_000   # US port: USD 20-session average $ volume
    min_free_float: 25.0
    min_data_completeness: 60.0
    liquidity_lookback_days: 30

magic_formula:
  min_market_cap_try: 1_000_000_000  # US port: $1B minimum (key name kept from BIST)

backtest:
  # Execution-realism knobs (A4 / #9, 2026-07-07 advisor review). Defaults
  # REPRODUCE the current published numbers EXACTLY — opt in to measure more
  # conservative / realistic scenarios. `bist backtest` reads these; the
  # investor-grade suite surfaces the resulting capacity + net-of-cost picture.
  #
  # Idle-cash yield: NOT_ENTERED slots and the post-stop remainder currently
  # earn 0% (frozen). "repo" = TCMB policy rate pro-rata; "gram_gold" = gram
  # gold return over the idle sub-period; "none" = current 0%.
  idle_cash_yield: none          # none | repo | gram_gold
  # Turkish round-trip transaction costs ADDED on top of the base friction.
  # Defaults 0 so the published 0.4% base is unchanged. Typical live values:
  # commission ~2-5 bps/side, BSMV = 5% OF the commission.
  commission_pct_per_side: 0.0   # e.g. 0.0003 = 3 bps per side
  bsmv_pct_of_commission: 0.0    # e.g. 0.05 = 5% BSMV on the commission
  # Liquidity-scaled market impact (capacity realism). When enabled, each NEW
  # buy pays an extra impact% ≈ impact_coef × (trade_try / ADV_try), so thin
  # names cost more at larger AUM. Default disabled = flat friction (current).
  liquidity_impact:
    enabled: false
    portfolio_try: 1_000_000     # assumed deployable capital for the impact calc
    impact_coef: 0.10            # impact% per 1.0 of participation (trade/ADV)
    adv_lookback_days: 30        # window for average daily TRY turnover
    participation_cap: 0.20      # a slot may take at most 20% of a name's ADV/day

risk_tiers:
  high:
    min_volatility: 0.35
    min_beta: 1.2
  medium:
    volatility_range: [0.20, 0.35]
    beta_range: [0.8, 1.2]
  low:
    max_volatility: 0.20
    max_beta: 0.8

filters:
  alpha:
    exclude_high_risk: true
    min_free_float: 25.0
    min_avg_volume_try: 20_000_000   # US port: USD 20-session average $ volume
    min_data_completeness: 70.0
    min_fscore: 5
alpha_research:
  quality_shadow_raw_fscore: 4
  free_float_shadow_min: 15.0
  free_float_shadow_alpha_min: 85.0
  scenario_relaxed_operating_fscore: 4

selection_legacy_disabled:
  target_count: 3
  max_per_sector: 2
  max_banks_per_portfolio: 1
  min_fscore: 4
  min_data_completeness: 0.60
  turnover_top_n: 10
  turnover_threshold: 0.05     # keep if within 5% of top scorer
  max_monthly_turnover: 0.50
  stop_loss_pct: 0.18          # entry × 0.82
  max_target_multiple: 2.5     # cap target price at 2.5× entry (150% upside max)
  min_technical_score: 35.0    # momentum confirms the idea; it should not rescue weak trends

banking:
  # Blend ratio: 60% absolute thresholds + 40% peer ranking
  absolute_weight: 0.60
  peer_weight: 0.40

  # Absolute threshold ranges for linear interpolation (floor→0, ceiling→100)
  absolute_thresholds:
    pb_vs_sector:                  # P/B ratio — lower is better
      floor: 3.0                   # P/B >= 3.0 → score 0
      ceiling: 0.5                 # P/B <= 0.5 → score 100
      direction: lower             # lower raw value = better

    roe:                           # Return on Equity
      floor: 0.05                  # ROE <= 5% → score 0
      ceiling: 0.25                # ROE >= 25% → score 100
      direction: higher

    car:                           # Capital Adequacy Ratio
      floor: 0.12                  # CAR <= 12% → score 0
      ceiling: 0.18                # CAR >= 18% → score 100
      direction: higher

    npl_ratio:                     # Non-Performing Loans ratio — lower is better
      floor: 0.10                  # NPL >= 10% → score 0
      ceiling: 0.02                # NPL <= 2% → score 100
      direction: lower

    cost_income:                   # Cost/Income ratio — lower is better
      floor: 0.65                  # C/I >= 65% → score 0
      ceiling: 0.35                # C/I <= 35% → score 100
      direction: lower

    nim:                           # Net Interest Margin
      floor: 0.01                  # NIM <= 1% → score 0
      ceiling: 0.05                # NIM >= 5% → score 100
      direction: higher

    loan_growth:                   # YoY loan growth
      floor: -0.10                 # Growth <= -10% → score 0
      ceiling: 0.30                # Growth >= 30% → score 100
      direction: higher

  # Legacy thresholds (kept for reference / other consumers)
  car_minimum: 0.12
  car_good: 0.15
  nim_weak: 0.02
  nim_strong: 0.05
  npl_good: 0.02
  npl_distressed: 0.10
  cost_income_efficient: 0.40
  cost_income_poor: 0.65
  ldr_conservative: 0.90
  ldr_aggressive: 1.20

technical:
  # Component weights (must sum to 1.0)
  weight_ma: 0.50              # price vs 200-day MA — most important trend signal
  weight_rsi: 0.30             # RSI zone — entry quality
  weight_vol: 0.20             # volume trend — conviction confirmation

  # RSI thresholds
  rsi_oversold: 30.0           # RSI below this = oversold (signal = 0.5)
  rsi_overbought: 70.0         # RSI above this = overbought (signal = 0.0)

  # Volume ratio thresholds (20-day avg / 60-day avg)
  vol_rising_threshold: 1.10   # ratio >= 1.10 = rising interest (signal = 1.0)
  vol_flat_lo_threshold: 0.90  # ratio < 0.90  = fading interest (signal = 0.0)

  # Minimum rows required for each component
  min_rows_200ma: 200          # trading days for the moving average
  min_rows_rsi: 15             # minimum changes needed for RSI
  min_rows_volume: 60          # trading days for volume trend

technical_enhanced:
  # Master toggle for enhanced indicators (5 new indicators: MACD, Bollinger, ADX, OBV, S/R)
  enabled: false               # Start disabled for safety, set true to enable blended scoring

  # Blending weights (must sum to 1.0)
  classic_weight: 0.60         # Weight for classic 3 signals (MA, RSI, Volume)
  enhanced_weight: 0.40        # Weight for enhanced 5 signals (MACD, BB, ADX, OBV, S/R)

  # Enhanced signal component weights (must sum to 1.0)
  weight_macd: 0.25            # MACD crossover and position
  weight_bollinger: 0.20       # Bollinger Band position
  weight_adx: 0.20             # Trend strength (ADX)
  weight_obv: 0.20             # On-Balance Volume trend
  weight_support_resistance: 0.15  # Support/Resistance proximity

  # MACD parameters (Moving Average Convergence Divergence)
  macd_ema_short: 12           # Fast EMA period
  macd_ema_long: 26            # Slow EMA period
  macd_signal: 9               # Signal line EMA period
  min_rows_macd: 35            # Minimum data requirement (26 + 9)

  # Bollinger Bands parameters
  bb_period: 20                # SMA period for middle band
  bb_std_dev: 2.0              # Standard deviation multiplier for upper/lower bands
  bb_middle_pct: 0.50          # Middle 50% of band width gets signal 1.0
  min_rows_bb: 20              # Minimum data requirement

  # ADX parameters (Average Directional Index)
  adx_period: 14               # Directional movement period
  adx_strong: 25.0             # ADX > 25 = strong trend (signal 1.0)
  adx_developing: 20.0         # ADX 20-25 = developing trend (signal 0.5)
  min_rows_adx: 28             # Minimum data requirement (14 + 14 for smoothing)

  # OBV parameters (On-Balance Volume)
  obv_short_period: 20         # Short-term slope calculation period
  obv_long_period: 60          # Long-term slope calculation period
  obv_rising_threshold: 0.10   # Slope > 0.10 = rising interest (signal 1.0)
  obv_flat_threshold: -0.05    # Slope < -0.05 = falling interest (signal 0.0)
  min_rows_obv: 60             # Minimum data requirement

  # Support/Resistance parameters
  sr_lookback_days: 252        # 1-year window for 52-week high/low
  sr_resistance_zone: 0.95     # Top 5% of range = at resistance (signal 0.0)
  sr_upper_zone: 0.75          # Top 25% of range = upper zone (signal 0.5)
  min_rows_sr: 252             # Minimum data requirement (1 year)

quality_flags:
  late_filing_days: 75         # flag if publication_date > period_end + 75 days
  high_related_party_pct: 0.25 # flag if related party revenue > 25%
  price_divergence_pct: 0.02   # flag if Is Yatirim vs Yahoo > 2%

risk_classifier:
  # Weights per dimension (must sum to 1.0)
  weights:
    volatility: 0.25
    beta: 0.25
    market_cap: 0.20
    liquidity: 0.15
    leverage: 0.15

  # Volatility: 252-day annualized std dev of log-returns
  volatility:
    low_max: 0.20              # annualized vol < 20% -> LOW risk
    high_min: 0.35             # annualized vol > 35% -> HIGH risk

  # Beta vs BIST-100 over trailing 252 trading days
  beta:
    low_max: 0.80              # beta < 0.8 -> LOW risk
    high_min: 1.20             # beta > 1.2 -> HIGH risk

  # Market capitalization in TRY
  market_cap:
    large_min: 10_000_000_000  # US port: > $10B -> LARGE (LOW risk)
    small_max: 2_000_000_000   # US port: < $2B  -> SMALL (HIGH risk)

  # 20-day average daily TRY turnover.
  # ISYATIRIM rows already store TRY turnover; YAHOO rows use close * volume.
  liquidity:
    high_min: 100_000_000      # US port: avg $ turnover > $100M -> HIGH liquidity
    low_max: 20_000_000        # US port: avg $ turnover < $20M -> LOW liquidity

  # Debt / Equity ratio from most recent annual balance sheet
  leverage:
    low_max: 0.50              # D/E < 0.5 -> LOW risk
    high_min: 1.50             # D/E > 1.5 -> HIGH risk

  # Composite score thresholds (weighted sum of dimension scores 1-3)
  composite:
    low_max: 1.50              # composite <= 1.5 -> LOW risk tier
    high_min: 2.20             # composite > 2.2  -> HIGH risk tier
