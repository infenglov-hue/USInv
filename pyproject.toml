[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "usinv"
version = "0.1.0"
description = "Point-in-time systematic US equity research and portfolio engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "exchange-calendars==4.13.2",
  "numpy==1.26.4",
  "pandas==2.3.3",
  "pyarrow==25.0.0",
  "PyYAML>=6.0",
  "secfsdstools==2.4.3",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=4.0",
  "pytest>=8.0",
  "ruff>=0.9",
]

[project.scripts]
usinv = "usinv.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["usinv"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["usinv/data/edgar/vendor/secfsdstools_2_4_3"]
force-exclude = true

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PIE", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
