name: US Picker Feed

# BIST Picker "Publish Mobile Feed" port. All crons are UTC. The NYSE closes
# 20:00 UTC (EDT) / 21:00 UTC (EST); the evening runs land after the close in
# both seasons. The pre-open run prepares the T session from T-1 data; the
# Sunday run pre-stages a rotation Monday.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run the real pipeline without storing or publishing any data"
        default: true
        type: boolean
      price_days:
        description: "Calendar days of prices to refresh (1–120)"
        default: 15
        type: number
      prepare_next_rotation:
        description: "Prepare the next rotation instead of today's session"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 22 * * 1-5"
    - cron: "47 22 * * 1-5"
    - cron: "17 11 * * 1-5"
    - cron: "17 17 * * 0"

concurrency:
  group: us-picker-feed
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      # Runtime DB lives on this repo's private *draft* release "state-current"
      # (drafts are visible only to collaborators); GITHUB_TOKEN can manage it.
      STATE_REPOSITORY: ${{ github.repository }}
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      US_PICKER_SEC_EMAIL: ${{ secrets.USINV_EDGAR_EMAIL }}
      US_PICKER_DB_PATH: ${{ github.workspace }}/data/us_picker.db
      FEED_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      PRICE_DAYS: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.price_days) || '15' }}
      PREPARE_NEXT_ROTATION: ${{ inputs.prepare_next_rotation }}
      TZ: America/New_York
    steps:
      - name: Validate required configuration
        run: |
          set -euo pipefail
          for name in ALPACA_KEY_ID ALPACA_SECRET_KEY US_PICKER_SEC_EMAIL; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required Actions secret for ${name}."
              exit 1
            fi
          done
          if [[ ! "${PRICE_DAYS}" =~ ^[0-9]{1,3}$ ]] || (( 10#${PRICE_DAYS} < 1 || 10#${PRICE_DAYS} > 120 )); then
            echo '::error::price_days must be an integer from 1 to 120.'
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[dev,enhanced]"

      - name: Quality gate (manual runs)
        if: github.event_name != 'schedule'
        run: python -m pytest -q us_picker/tests tests_picker

      - name: Restore runtime database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p data
          python scripts_picker/state_db_artifact.py pull \
            --repository "${STATE_REPOSITORY}" --target data/us_picker.db

      - name: Restore published snapshot for regression check
        if: vars.US_PICKER_PUBLIC_MARKET_DATA == 'true' && !inputs.dry_run
        run: |
          set -euo pipefail
          mkdir -p mobile-feed-dist
          target=mobile-feed-dist/mobile_snapshot.db.gz
          status=$(curl --silent --show-error --retry 3 --max-time 120 \
            --output "${target}" --write-out '%{http_code}' "${FEED_BASE_URL}/mobile_snapshot.db.gz")
          case "${status}" in
            200) gzip --test "${target}" ;;
            404) rm -- "${target}" ;;
            *) echo "::error::Current snapshot could not be checked (HTTP ${status})."; exit 1 ;;
          esac

      - name: Refresh prices, model and snapshot privately
        run: |
          set -euo pipefail
          private_run() {
            local stage=$1
            shift
            printf 'Running %s\n' "${stage}"
            if ! python -m us_picker "$@" >/dev/null 2>&1; then
              echo "::error::${stage} failed. Reproduce locally for private diagnostics."
              exit 1
            fi
          }
          private_run 'Alpaca/SEC universe and price refresh' fetch --prices-only --refresh-universe --price-days "${PRICE_DAYS}"
          python - <<'PY'
          from datetime import timedelta

          from sqlalchemy import or_

          from us_picker.data.fetcher import _last_complete_session_day
          from us_picker.db.connection import get_engine, session_scope
          from us_picker.db.schema import Company, DailyPrice
          from us_picker.portfolio.execution import latest_completed_session_date

          expected = _last_complete_session_day()
          with session_scope(get_engine()) as session:
              observed = latest_completed_session_date(session, expected + timedelta(days=1))
              prices = session.query(Company.ticker).join(DailyPrice).filter(
                  DailyPrice.date == expected, DailyPrice.adjusted_close > 0,
                  or_(Company.ticker == "SPY", Company.is_active.is_(True)),
                  or_(Company.ticker == "SPY", Company.company_type.is_(None), Company.company_type != "INDEX"),
              )
              tickers = {ticker for (ticker,) in prices}
          if observed != expected or "SPY" not in tickers or len(tickers) < 2:
              raise SystemExit("::error::Price refresh lacks a broadly covered completed XNYS session or its SPY benchmark.")
          PY
          private_run 'Score-input preparation' clean
          private_run 'Exit checks' check-exits --apply --yes
          weekday_ny=$(date +%u)
          if { [[ "${GITHUB_EVENT_NAME}" = schedule ]] && [[ "${weekday_ny}" = 5 || "${weekday_ny}" = 7 ]]; } || \
             [[ "${PREPARE_NEXT_ROTATION}" = true ]]; then
            private_run 'Next rotation' prepare-portfolio --next-rotation --max-days-ahead 3
          else
            private_run 'Portfolio preparation' prepare-portfolio
          fi
          echo 'Recording private forward observations'
          if ! python -m us_picker.forward_observation >/dev/null 2>&1; then
            echo '::error::Forward observation failed. Reproduce locally for private diagnostics.'
            exit 1
          fi
          private_run 'Backtest' backtest --start-date 2017-01-09 --execution same-day-open
          private_run 'Mobile snapshot export' export-mobile-feed --feed-dir mobile-feed-dist

      - name: Verify mobile snapshot
        run: |
          set -euo pipefail
          cp -r pwa site
          cp mobile-feed-dist/{manifest.json,mobile_snapshot.db.gz,live_tickers.json} site/
          (cd site && node --check app.js && node --check sw.js && node tests/pwa-static-check.mjs)
          rm -r site/tests

      - name: Store runtime database
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts_picker/state_db_artifact.py push \
            --source data/us_picker.db --repository "${STATE_REPOSITORY}"

      - name: Store verified private mobile feed
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m scripts_picker.mobile_feed_artifact push \
            --source-dir mobile-feed-dist --repository "${STATE_REPOSITORY}"

      - name: Stage authorized public feed for Pages
        if: vars.US_PICKER_PUBLIC_MARKET_DATA == 'true' && !inputs.dry_run
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: refresh
    if: vars.US_PICKER_PUBLIC_MARKET_DATA == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    concurrency:
      group: us-picker-pages
      cancel-in-progress: false
    environment: github-pages
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
