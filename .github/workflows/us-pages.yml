name: US Picker PWA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pwa/**'
      - '.github/workflows/us-pages.yml'

concurrency:
  group: us-picker-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: vars.US_PICKER_PUBLIC_MARKET_DATA != 'true' && vars.US_PICKER_ENCRYPTED_MOBILE != 'true' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify and assemble public shell
        run: |
          set -euo pipefail
          (cd pwa && node --check app.js && node --check sw.js && node tests/pwa-static-check.mjs --shell-only)
          mkdir site
          cp pwa/*.js pwa/index.html pwa/index.css pwa/manifest.webmanifest site/
          cp -r pwa/icons pwa/vendor site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  build_encrypted:
    if: vars.US_PICKER_ENCRYPTED_MOBILE == 'true' && github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # GitHub requires push access to list a repository's draft releases.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate encrypted Pages configuration
        env:
          PUBLIC_MARKET_DATA: ${{ vars.US_PICKER_PUBLIC_MARKET_DATA }}
          US_PICKER_MOBILE_KEY: ${{ secrets.US_PICKER_MOBILE_KEY }}
        run: |
          set -euo pipefail
          if [[ "${PUBLIC_MARKET_DATA}" == 'true' ]]; then
            echo '::error::Encrypted mobile and public market data modes are mutually exclusive.'
            exit 1
          fi
          if [[ ! "${US_PICKER_MOBILE_KEY}" =~ ^[A-Za-z0-9_-]{43}$ ]]; then
            echo '::error::US_PICKER_MOBILE_KEY must be a 32-byte base64url key.'
            exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Pull verified private mobile feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m scripts_picker.mobile_feed_artifact pull \
            --repository "${GITHUB_REPOSITORY}" --target-dir "${RUNNER_TEMP}/private-mobile-feed"
      - name: Verify app shell and assemble encrypted mobile feed
        env:
          US_PICKER_MOBILE_KEY: ${{ secrets.US_PICKER_MOBILE_KEY }}
        run: |
          set -euo pipefail
          (cd pwa && node --check app.js && node --check sw.js && node tests/pwa-static-check.mjs --shell-only)
          node scripts_picker/encrypt_mobile_feed.mjs "${RUNNER_TEMP}/private-mobile-feed" site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: [build, build_encrypted]
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build_encrypted.result == 'success') }}
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
