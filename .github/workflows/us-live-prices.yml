name: US Picker Live Prices

# Near-live quotes for the PWA every 30 minutes through the US session
# (13:30-20:00 UTC in EDT, 14:30-21:00 UTC in EST). Uses the compact
# live_tickers.json contract from the published site, never the big DB.

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 13-21 * * 1-5"

concurrency:
  group: us-picker-live-prices
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  live:
    if: vars.US_PICKER_PUBLIC_MARKET_DATA == 'true' && vars.US_PICKER_ENCRYPTED_MOBILE != 'true' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e .
      - name: Download live ticker contract
        id: ticker-contract
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --retry 2 --max-time 30 \
            --output live_tickers.json --write-out '%{http_code}' "${SITE_URL}/live_tickers.json")
          case "${status}" in
            200) echo 'ready=true' >> "${GITHUB_OUTPUT}" ;;
            404) echo 'Live ticker contract is not deployed yet.' ;;
            *) echo "::error::Live ticker contract request failed (HTTP ${status})."; exit 1 ;;
          esac
      - name: Check XNYS session
        id: session
        if: steps.ticker-contract.outputs.ready == 'true'
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from os import environ
          from zoneinfo import ZoneInfo

          from usinv.calendar import default_calendar

          now = datetime.now(timezone.utc)
          today = now.astimezone(ZoneInfo("America/New_York")).date()
          calendar = default_calendar()
          session = calendar.session(today) if calendar.is_session(today) else None
          if session and (environ["GITHUB_EVENT_NAME"] == "workflow_dispatch" or session.open_at <= now <= session.close_at):
              with open(environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("ready=true\n")
          PY
      - name: Build live_prices.json
        if: steps.session.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python -m us_picker export-live-prices --tickers-file live_tickers.json --output live_prices.json
      - name: Push to live-data branch
        if: steps.session.outputs.ready == 'true'
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp live_prices.json /tmp/live_prices.json
          git fetch --depth 1 origin live-data || true
          if git show-ref --verify --quiet refs/remotes/origin/live-data; then
            git checkout -B live-data origin/live-data
          else
            git checkout --orphan live-data && git rm -rfq .
          fi
          cp /tmp/live_prices.json live_prices.json
          git add live_prices.json
          if [ -n "$(git status --porcelain -- live_prices.json)" ]; then
            git commit -m "Update US live prices"
            git push origin live-data
          fi
