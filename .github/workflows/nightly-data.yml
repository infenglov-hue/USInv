name: nightly-data

# Phase 2.4 freshness / coverage kill-switch (DATA_SPEC §8, OPS_SPEC §3).
# The nightly-data pipeline (EDGAR delta -> price bars -> action reconcile ->
# macro pulls) is built across Phases 2-6; this workflow already wires the
# freshness kill-switch so that ANY stale/coverage gate exits red and blocks
# delivery. Later phases replace the pinned fixture below with the live
# pipeline-produced freshness-inputs file and a real evaluation instant.

on:
  schedule:
    - cron: "17 6 * * 1-5" # ~01:17 ET on weekdays
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Verify kill-switch (stale fixture must exit red)
        run: pytest -q tests/test_freshness.py
      - name: Freshness gate
        # Non-zero exit on any red gate fails the job and blocks delivery.
        run: >-
          python -m usinv freshness-gate
          --inputs tests/fixtures/freshness/nightly_inputs.json
          --as-of 2026-02-17T16:00:00-05:00
