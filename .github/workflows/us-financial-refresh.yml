name: US Picker Financial Refresh

# SEC filings + FRED macro, twice a week (BIST Picker "Financial Refresh").
# Only companies with a new 10-K/10-Q on EDGAR in the last 10 days are
# re-downloaded, so the run stays small.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Refresh and validate a temporary copy without storing it"
        default: true
        type: boolean
      financial_days:
        description: "Calendar days of SEC filings to refresh (7–120)"
        default: 10
        type: number
  schedule:
    - cron: "7 9 * * 2,6"

concurrency:
  group: us-picker-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Runtime DB lives on this repo's private *draft* release "state-current"
      # (drafts are visible only to collaborators); GITHUB_TOKEN can manage it.
      STATE_REPOSITORY: ${{ github.repository }}
      US_PICKER_SEC_EMAIL: ${{ secrets.USINV_EDGAR_EMAIL }}
      US_PICKER_DB_PATH: ${{ github.workspace }}/data/us_picker.db
      FINANCIAL_DAYS: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.financial_days) || '10' }}
      TZ: America/New_York
    steps:
      - name: Validate required configuration
        run: |
          set -euo pipefail
          if [[ -z "${US_PICKER_SEC_EMAIL}" ]]; then
            echo '::error::Missing required Actions secret USINV_EDGAR_EMAIL.'
            exit 1
          fi
          if [[ ! "${FINANCIAL_DAYS}" =~ ^[0-9]{1,3}$ ]] || (( 10#${FINANCIAL_DAYS} < 7 || 10#${FINANCIAL_DAYS} > 120 )); then
            echo '::error::financial_days must be an integer from 7 to 120.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e ".[enhanced]"
      - name: Restore runtime database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          python scripts_picker/state_db_artifact.py pull \
            --repository "${STATE_REPOSITORY}" --target data/us_picker.db
      - name: Refresh and validate fundamentals privately
        run: |
          set -euo pipefail
          private_run() {
            local stage=$1
            shift
            printf 'Running %s\n' "${stage}"
            if ! python -m us_picker "$@" >/dev/null 2>&1; then
              echo "::error::${stage} failed. Reproduce locally for private diagnostics."
              exit 1
            fi
          }
          private_run 'SEC filing refresh' fetch --financials-only --financial-days "${FINANCIAL_DAYS}"
          private_run 'FRED macro refresh' fetch --macro-only
          private_run 'Score-input preparation' clean
          private_run 'Raw statement freshness' check-financial-freshness
          private_run 'Score-input freshness' check-score-input-freshness

      - name: Report financial coverage
        run: |
          python - <<'PY'
          from datetime import date, timedelta

          from sqlalchemy import distinct, func, select

          from us_picker.db.connection import session_scope
          from us_picker.db.schema import FinancialStatement

          today = date.today()
          quarter_end = today.replace(
              month=((today.month - 1) // 3) * 3 + 1, day=1
          ) - timedelta(days=1)
          statements = FinancialStatement
          with session_scope() as session:
              latest = session.scalar(select(func.max(statements.publication_date)).where(
                  statements.publication_date <= today
              ))
              count = func.count(distinct(statements.company_id))
              recent = session.scalar(select(count).where(
                  statements.publication_date.between(today - timedelta(days=30), today)
              ))
              quarter = session.scalar(select(count).where(
                  statements.period_end == quarter_end,
                  statements.publication_date <= today,
              ))
          print(f"Latest SEC publication date: {latest}; issuers in last 30 days: {recent}")
          print(f"Issuers reporting the {quarter_end} period: {quarter}")
          if not recent:
              print("::warning::No SEC statement publications in the last 30 days.")
          PY

      - name: Store runtime database
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts_picker/state_db_artifact.py push \
            --source data/us_picker.db --repository "${STATE_REPOSITORY}"
