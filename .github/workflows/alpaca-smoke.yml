name: Alpaca market-data smoke

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: Historical symbol to verify
        required: true
        default: AAPL
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: alpaca-market-data-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'alpaca-live-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_SMOKE_SYMBOL: ${{ inputs.symbol || 'AAPL' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Require Alpaca credentials
        run: test -n "$ALPACA_KEY_ID" && test -n "$ALPACA_SECRET_KEY"
      - name: Install project
        run: python -m pip install --disable-pip-version-check .
      - name: Verify delayed SIP bars and corporate-actions access
        run: python -m usinv alpaca-smoke --symbol "$ALPACA_SMOKE_SYMBOL"
