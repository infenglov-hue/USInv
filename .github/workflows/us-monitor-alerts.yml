name: US Picker Alerts

# Telegram stop/target/SEC-filing/rotation alerts for open positions, after
# each feed run and three times through the US session (UTC).

on:
  workflow_run:
    workflows: ["US Picker Feed"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "0 15,17,19 * * 1-5"

concurrency:
  group: us-picker-alerts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STATE_REPOSITORY: ${{ vars.US_STATE_REPOSITORY || format('{0}/USInv-state', github.repository_owner) }}
      PUBLISH_REPO_TOKEN: ${{ secrets.PUBLISH_REPO_TOKEN }}
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      US_PICKER_SEC_EMAIL: ${{ secrets.USINV_EDGAR_EMAIL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      US_PICKER_DB_PATH: ${{ github.workspace }}/data/us_picker.db
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e ".[enhanced]"
      - name: Restore database and alert state
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_REPO_TOKEN }}
        run: |
          set -euxo pipefail
          git clone --depth 1 "https://x-access-token:${PUBLISH_REPO_TOKEN}@github.com/${STATE_REPOSITORY}.git" state-repo
          mkdir -p data
          python scripts_picker/state_db_artifact.py pull \
            --repository "${STATE_REPOSITORY}" --target data/us_picker.db
          if [ -f state-repo/state/current/alerts_state.json ]; then
            cp state-repo/state/current/alerts_state.json data/alerts_state.json
          fi
      - run: python -m us_picker monitor-alerts
      - name: Save alert state
        run: |
          set -euxo pipefail
          mkdir -p state-repo/state/current
          cp data/alerts_state.json state-repo/state/current/alerts_state.json
          cd state-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/current/alerts_state.json
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Update US alert state"
            git pull --rebase
            git push
          fi
