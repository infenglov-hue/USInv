name: FSDS smoke

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: fsds-smoke
  cancel-in-progress: false

jobs:
  download-and-audit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'fsds-live-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      USINV_EDGAR_EMAIL: ${{ secrets.USINV_EDGAR_EMAIL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Require monitored SEC contact
        run: test -n "$USINV_EDGAR_EMAIL"
      - name: Install project
        run: python -m pip install --disable-pip-version-check -e .
      - name: Download the small headers-only 2009q1 package
        run: >-
          python -m usinv fsds-sync
          --start 2009q1
          --end 2009q1
          --archive-dir "${{ runner.temp }}/fsds"
      - name: Prove the archived object is reusable without networking
        run: >-
          python -m usinv fsds-sync
          --start 2009q1
          --end 2009q1
          --archive-dir "${{ runner.temp }}/fsds"
      - name: Ingest all four headers-only raw tables into Parquet
        run: >-
          python -m usinv fsds-ingest
          --start 2009q1
          --end 2009q1
          --archive-dir "${{ runner.temp }}/fsds"
          --output-dir "${{ runner.temp }}/fsds-parquet"
      - name: Verify the Parquet cache without rebuilding it
        run: >-
          python -m usinv fsds-ingest
          --start 2009q1
          --end 2009q1
          --archive-dir "${{ runner.temp }}/fsds"
          --output-dir "${{ runner.temp }}/fsds-parquet"
      - name: Build immutable first-filed and latest fact views
        run: >-
          python -m usinv pit-build
          --start 2009q1
          --end 2009q1
          --archive-dir "${{ runner.temp }}/fsds"
          --parquet-dir "${{ runner.temp }}/fsds-parquet"
          --store-dir "${{ runner.temp }}/pit-store"
      - name: Verify the content-addressed PIT snapshot
        run: >-
          python -m usinv pit-build
          --start 2009q1
          --end 2009q1
          --archive-dir "${{ runner.temp }}/fsds"
          --parquet-dir "${{ runner.temp }}/fsds-parquet"
          --store-dir "${{ runner.temp }}/pit-store"
