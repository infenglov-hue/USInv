schema_version: 1
contract: usinv_fsds_quarterly
status: executable
source: DATA_SPEC.md#15-quarterly-derivation
chain_version: usinv-sec-concepts-v1

period_identity:
  source: [ddate, qtrs]
  forbidden_grouping_fields: [filing_fy, filing_fp]
  annual_window_days: [330, 385]
  open_year_anchor: last_already_accepted_10_k
  note: A future annual period end never enters Q1-Q3 availability or identity.

direct_quarters:
  forms: [10-Q, 10-Q/A]
  preferred_qtrs: 1
  fallback: ytd_difference

q4:
  formula: fiscal_year_value - sum(q1, q2, q3)
  annual_forms: [10-K, 10-K/A]
  annual_qtrs: 4
  required_direct_quarter_count: 3
  match_keys: [cik, tag, uom]
  fiscal_window_days: [330, 385]

availability:
  field: accepted
  aggregation: max
  timezone: UTC

quarantine:
  - quarter_count_not_three
  - fiscal_year_change_or_10_kt
  - ipo_year_missing_quarters
  - unit_mismatch
  - concept_mismatch
  - accounting_identity_failure

excluded_forms: [20-F, 20-F/A, 40-F, 40-F/A]

custom_revenue:
  source: PRE
  statement: IS
  maximum_line: 5
  label_pattern: revenue|revenues|sales
  require_custom_version_equals_adsh: true
  require_one_candidate_tag_per_report: true

coverage:
  phase_1_4_measurement: strict_observed_presence
  phase_1_4_denominator: provisional_eligible_issuer_x_complete_concept_table
  core_threshold: 0.90
  secondary_threshold: 0.75
  applicability_engine: phase_1_5
  enforcement: phase_2_3_final_universe_required
  final_denominator: date_valid_v1_universe_x_evidence_backed_applicable_concepts
  missing_value_policy: missing_is_not_zero
  mandatory_scoring_inputs: fail_closed

validation_classes:
  nonnegative: [Revenue]
  signed: [NetIncomeLoss, NetCashProvidedByUsedInOperatingActivities]
  note: Never apply a blanket absolute-Q4-less-than-absolute-FY rule to signed concepts.
